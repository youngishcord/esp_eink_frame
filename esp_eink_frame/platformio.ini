; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;
;   https://docs.platformio.org/page/projectconf.html

[env:upesy_wroom]
platform = espressif32
board = upesy_wroom
framework = arduino

monitor_speed = 115200

; The firmware links WiFi + WebServer + a browser asset bundle, so give the
; application a single large slot instead of two small OTA slots.
board_build.partitions = huge_app.csv

; Use a modern C++ dialect (std::function, std::optional, ...).
build_unflags =
    -std=gnu++11
    -std=gnu++14
build_flags =
    -std=gnu++17
    -Wall

; Regenerate src/web/WebAssets.generated.h from web/*.html|css|js before building.
extra_scripts = pre:tools/embed_web_assets.py

lib_deps =
    adafruit/RTClib@^2.1.4
    adafruit/Adafruit GFX Library@^1.11.9
    zinggjm/GxEPD2@^1.6.6
