; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;
;   https://docs.platformio.org/page/projectconf.html

; `pio run` builds the application only; the probe env is built explicitly.
[platformio]
default_envs = upesy_wroom

[env:upesy_wroom]
platform = espressif32
board = upesy_wroom
framework = arduino

monitor_speed = 115200

; The firmware links WiFi + WebServer + a browser asset bundle, so give the
; application a single large slot instead of two small OTA slots.
board_build.partitions = huge_app.csv

; Use a modern C++ dialect (std::function, std::optional, ...).
build_unflags =
    -std=gnu++11
    -std=gnu++14
build_flags =
    -std=gnu++17
    -Wall
    ; Arduino core log level (0=none, 1=error, 2=warn, 3=info, 4=debug).
    ; Level 2 keeps the SD library's "GO_IDLE_STATE failed" / "APP_OP_COND
    ; failed" diagnostics, which are compiled out at the default level and are
    ; the only way to see which init command the card rejects.
    -DCORE_DEBUG_LEVEL=2

; Regenerate src/web/WebAssets.generated.h from web/*.html|css|js before building.
extra_scripts = pre:tools/embed_web_assets.py

lib_deps =
    adafruit/RTClib@^2.1.4
    adafruit/Adafruit GFX Library@^1.11.9
    zinggjm/GxEPD2@^1.6.6

; The application build must not compile the standalone probe in src/probe.
build_src_filter = +<*> -<probe/>

; Minimal SD bring-up probe. It is a separate firmware image: it runs the exact
; standalone sketch that is known to work on this hardware plus a raw SPI
; command dump, which tells a hardware mount failure from a firmware one.
;
;   pio run -e sd_probe -t upload
;   pio device monitor
[env:sd_probe]
platform = espressif32
board = upesy_wroom
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=2
build_src_filter = +<probe/>
